# ============================================================================
# 博客部署配置文件
# ============================================================================
#
# 优先级：环境变量 > 配置文件 > 脚本默认值
#
# 复制自：deploy-config.toml.example
# 修改日期：2025-02-22

# ============================================================================
# 路径配置
# ============================================================================

# Obsidian 笔记存放路径（源）
source = "/Users/xiuhao/Library/Mobile Documents/iCloud~md~obsidian/Documents/个人/posts"

# Hugo 内容目录（目标）
destination = "content/posts"

# Hugo 项目根目录
hugo_dir = "."

# Hugo 构建输出目录（通常是 public）
public_dir = "public"


# ============================================================================
# Git 配置
# ============================================================================

# 远程仓库地址
git_remote = "git@github.com:whistleditty/whistleditty.github.io.git"

# 主项目分支（源码推送到 main）
main_branch = "main"

# GitHub Pages 部署分支（public 推送到 master）
# 注意：这是 public 目录要推送的分支，不是主项目的分支
hostinger_branch = "master"


# ============================================================================
# 部署配置
# ============================================================================

# 是否启用 Hostinger 部署（这里实际用于推送到 GitHub Pages）
enable_hostinger = true

# 如果文件未变更，是否跳过 Hugo 构建（提升性能）
skip_if_no_changes = true


# ============================================================================
# Hugo 配置
# ============================================================================

# Hugo 环境：production 或 development
hugo_env = "production"


# ============================================================================
# 使用说明
# ============================================================================
#
# 运行部署脚本：
#   ./deploy.sh
#
# 预览操作（不实际执行）：
#   ./deploy.sh --dry-run
#
# 显示详细日志：
#   ./deploy.sh --verbose
#
# 仅构建不部署：
#   ./deploy.sh --build-only
#
# 环境变量覆盖示例：
#   DEPLOY_ENABLE_HOSTINGER=false ./deploy.sh
#
# ============================================================================

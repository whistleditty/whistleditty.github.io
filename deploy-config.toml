# ============================================================================
# 博客部署配置文件
# ============================================================================
#
# 优先级：环境变量 > 配置文件 > 脚本默认值
#
# 复制自：deploy-config.toml.example
# 修改日期：2025-02-22

# ============================================================================
# 路径配置
# ============================================================================

# Obsidian 笔记存放路径（源）
source = "/Users/xiuhao/Library/Mobile Documents/iCloud~md~obsidian/Documents/个人/posts"

# Hugo 内容目录（目标）
destination = "content/posts"

# Hugo 项目根目录
hugo_dir = "."

# Hugo 构建输出目录（通常是 public）
public_dir = "public"


# ============================================================================
# Git 配置
# ============================================================================

# 远程仓库地址
git_remote = "git@github.com:whistleditty/whistleditty.github.io.git"

# GitHub Pages 部署分支（使用 master，不是 main）
main_branch = "master"

# Hostinger 部署分支（已禁用，保持配置以备将来使用）
hostinger_branch = "hostinger"


# ============================================================================
# 部署配置
# ============================================================================

# 是否启用 Hostinger 部署（GitHub Pages 已足够，禁用 Hostinger）
enable_hostinger = false

# 如果文件未变更，是否跳过 Hugo 构建（提升性能）
skip_if_no_changes = true


# ============================================================================
# Hugo 配置
# ============================================================================

# Hugo 环境：production 或 development
hugo_env = "production"


# ============================================================================
# 使用说明
# ============================================================================
#
# 运行部署脚本：
#   ./deploy.sh
#
# 预览操作（不实际执行）：
#   ./deploy.sh --dry-run
#
# 显示详细日志：
#   ./deploy.sh --verbose
#
# 仅构建不部署：
#   ./deploy.sh --build-only
#
# 环境变量覆盖示例：
#   DEPLOY_ENABLE_HOSTINGER=false ./deploy.sh
#
# ============================================================================
